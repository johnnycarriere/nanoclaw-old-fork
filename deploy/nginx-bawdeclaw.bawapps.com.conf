# Baw De Claw webchat — nginx vhost for bawdeclaw.bawapps.com (Thelio)
# Same pattern as dexbaw/sharks/hymns (direct-to-home, certbot TLS).
# Install (requires sudo):
#   1. Porkbun DNS: add A record  bawdeclaw.bawapps.com -> 96.33.130.70  (same as dexbaw.bawapps.com)
#   2. sudo cp ~/nanoclaw-v2/deploy/nginx-bawdeclaw.bawapps.com.conf /etc/nginx/sites-available/bawdeclaw-bawapps
#   3. sudo ln -s /etc/nginx/sites-available/bawdeclaw-bawapps /etc/nginx/sites-enabled/
#   4. sudo nginx -t && sudo systemctl reload nginx
#   5. sudo certbot --nginx -d bawdeclaw.bawapps.com   (certbot rewrites this file with TLS blocks)
# After TLS is live, update ~/nanoclaw-v2/.env. Public exposure REQUIRES public
# auth mode — local mode (static WEBCHAT_SECRET) refuses to start with a
# non-loopback WEBCHAT_PUBLIC_BASE_URL:
#   WEBCHAT_AUTH_MODE=public
#   WEBCHAT_PUBLIC_BASE_URL=https://bawdeclaw.bawapps.com
#   WEBCHAT_SESSION_SECRET=<32+ random chars>
#   WEBCHAT_AUTH_BASIC_ENABLED=true
#   WEBCHAT_BASIC_USERS=<user>:<hash from hashBasicPassword>   # see /add-webchat SKILL.md "Public mode"
#   (legacy alternative: WEBCHAT_BASIC_PASSWORD + WEBCHAT_BASIC_ALLOWED_USERNAMES)
#   WEBCHAT_MCP_HTTP_ENABLED=false   # opt-in; WEBCHAT_MCP_ALLOW_DCR=true only while registering an MCP client
# and restart:  systemctl --user restart nanoclaw-v2-8327f5a1.service
# Login rate limiting keys on X-Real-IP, which is trusted only because the
# proxy connects from loopback — keep proxy_set_header X-Real-IP below.
server {
    listen 80;
    server_name bawdeclaw.bawapps.com;

    location / {
        proxy_pass http://127.0.0.1:3200;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket (/api/ws) + long-lived streams
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 1h;
        # Attachment uploads (must match WEBCHAT_MAX_UPLOAD_BYTES; default 50 MiB)
        client_max_body_size 50m;
    }
}
